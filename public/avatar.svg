<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="studioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Key Lighting Accent -->
    <radialGradient id="keyLight" cx="65%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Skin Tone Gradients -->
    <linearGradient id="skinBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2cfb8"/>
      <stop offset="45%" stop-color="#dfb195"/>
      <stop offset="100%" stop-color="#ba8264"/>
    </linearGradient>

    <linearGradient id="neckShadow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#8c583e"/>
      <stop offset="100%" stop-color="#b0795c"/>
    </linearGradient>

    <linearGradient id="beardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#261a14" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#140d09" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1e18"/>
      <stop offset="50%" stop-color="#1b120e"/>
      <stop offset="100%" stop-color="#0f0a08"/>
    </linearGradient>

    <!-- Shirt Gradient (Dark Navy Oxford) -->
    <linearGradient id="navyShirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="collarLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#studioBg)"/>
  <rect width="600" height="600" fill="url(#keyLight)"/>

  <!-- Subtle Studio Vignette -->
  <circle cx="300" cy="270" r="280" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.4"/>

  <!-- Body / Shoulders (Dark Navy Button-down Shirt) -->
  <g id="clothing">
    <!-- Main Chest / Torso -->
    <path d="M120 600 C130 480 180 435 240 425 L300 455 L360 425 C420 435 470 480 480 600 Z" fill="url(#navyShirt)" filter="url(#softShadow)"/>

    <!-- Inner Shirt Shadow / Placket -->
    <path d="M296 450 L304 450 L304 600 L296 600 Z" fill="#090d16"/>
    <!-- Small subtle dark buttons -->
    <circle cx="300" cy="495" r="3.5" fill="#334155" stroke="#1e293b" stroke-width="1"/>
    <circle cx="300" cy="545" r="3.5" fill="#334155" stroke="#1e293b" stroke-width="1"/>

    <!-- Shirt Collars -->
    <path d="M236 422 L275 460 L298 440 L285 410 Z" fill="url(#collarLeft)"/>
    <path d="M364 422 L325 460 L302 440 L315 410 Z" fill="#1e293b"/>
  </g>

  <!-- Neck -->
  <g id="neck">
    <path d="M260 360 L260 435 C280 450 320 450 340 435 L340 360 Z" fill="url(#neckShadow)"/>
    <!-- Adam's apple / throat highlight -->
    <path d="M295 390 Q300 405 305 390 Z" fill="#b0795c" opacity="0.6"/>
  </g>

  <!-- Head & Ears -->
  <g id="head">
    <!-- Ears -->
    <ellipse cx="206" cy="272" rx="14" ry="24" fill="#d99f82" transform="rotate(-6 206 272)"/>
    <ellipse cx="207" cy="272" rx="8" ry="15" fill="#9e6246" opacity="0.6"/>
    <ellipse cx="394" cy="272" rx="14" ry="24" fill="#ca9174" transform="rotate(6 394 272)"/>
    <ellipse cx="393" cy="272" rx="8" ry="15" fill="#8c5339" opacity="0.6"/>

    <!-- Face Oval -->
    <path d="M218 240 C214 165 240 135 300 135 C360 135 386 165 382 240 C380 300 360 375 300 375 C240 375 220 300 218 240 Z" fill="url(#skinBase)" filter="url(#softShadow)"/>

    <!-- Cheekbones and facial contour shading -->
    <path d="M222 250 Q235 295 265 330 Q240 280 230 240 Z" fill="#ba7c5b" opacity="0.35"/>
    <path d="M378 250 Q365 295 335 330 Q360 280 370 240 Z" fill="#9c5f40" opacity="0.45"/>
    <ellipse cx="300" cy="225" rx="55" ry="30" fill="#fce4d4" opacity="0.35"/>
  </g>

  <!-- Eyes & Eyebrows (Warm Hazel/Green, Calm Focused Gaze) -->
  <g id="eyes">
    <!-- Eyebrows (Neat, masculine dark brown) -->
    <path d="M240 216 Q262 206 284 214 Q264 211 240 216 Z" fill="#1c130e" stroke="#1c130e" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M360 216 Q338 206 316 214 Q336 211 360 216 Z" fill="#1c130e" stroke="#1c130e" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Left Eye -->
    <g transform="translate(244, 226)">
      <!-- Sclera -->
      <path d="M0 8 Q16 0 32 8 Q16 16 0 8 Z" fill="#f8fafc"/>
      <!-- Iris (Hazel / Green-Amber) -->
      <circle cx="16" cy="8" r="6.5" fill="#4d5b3d"/>
      <circle cx="16" cy="8" r="4.5" fill="#2d3b24"/>
      <!-- Pupil -->
      <circle cx="16" cy="8" r="2.8" fill="#090d16"/>
      <!-- Catchlight -->
      <circle cx="14.5" cy="6.5" r="1.2" fill="#ffffff"/>
      <!-- Upper eyelid crease -->
      <path d="M -2 5 Q 16 -3 34 5" fill="none" stroke="#633924" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- Right Eye -->
    <g transform="translate(324, 226)">
      <!-- Sclera -->
      <path d="M0 8 Q16 0 32 8 Q16 16 0 8 Z" fill="#f8fafc"/>
      <!-- Iris (Hazel / Green-Amber) -->
      <circle cx="16" cy="8" r="6.5" fill="#4d5b3d"/>
      <circle cx="16" cy="8" r="4.5" fill="#2d3b24"/>
      <!-- Pupil -->
      <circle cx="16" cy="8" r="2.8" fill="#090d16"/>
      <!-- Catchlight -->
      <circle cx="14.5" cy="6.5" r="1.2" fill="#ffffff"/>
      <!-- Upper eyelid crease -->
      <path d="M -2 5 Q 16 -3 34 5" fill="none" stroke="#522b18" stroke-width="1.8" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Nose -->
  <g id="nose">
    <path d="M297 215 L294 274 Q285 278 290 282 Q300 285 310 282 Q315 278 306 274 L303 215 Z" fill="#c78663" opacity="0.3"/>
    <path d="M294 275 Q300 281 306 275" fill="none" stroke="#945333" stroke-width="2" stroke-linecap="round"/>
    <!-- Nostrils -->
    <ellipse cx="292" cy="278" rx="2.5" ry="1.5" fill="#472010"/>
    <ellipse cx="308" cy="278" rx="2.5" ry="1.5" fill="#472010"/>
  </g>

  <!-- Beard, Mustache & Mouth (Trimmed, Well-Groomed 3-5mm Full Beard) -->
  <g id="beard">
    <!-- Jawline and Chin Beard Shadow -->
    <path d="M220 270 C220 330 245 378 300 378 C355 378 380 330 380 270 C374 290 358 355 300 355 C242 355 226 290 220 270 Z" fill="url(#beardGrad)" filter="url(#softShadow)"/>
    
    <!-- Stipple texture and full beard contour -->
    <path d="M228 280 C234 330 256 372 300 372 C344 372 366 330 372 280 C364 320 340 352 300 352 C260 352 236 320 228 280 Z" fill="#120c09" opacity="0.9"/>
    
    <!-- Mustache -->
    <path d="M280 295 Q300 291 320 295 Q300 310 280 295 Z" fill="#1b120d"/>
    <path d="M282 297 Q300 293 318 297 Q300 307 282 297 Z" fill="#120b08"/>

    <!-- Lips underneath -->
    <path d="M288 310 Q300 313 312 310" stroke="#7e432a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M292 316 Q300 321 308 316" stroke="#5a2c19" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Soul patch -->
    <ellipse cx="300" cy="328" rx="5" ry="6" fill="#170f0b"/>
  </g>

  <!-- Hair (Short Dark Brown, Clean Cut with Natural Temples) -->
  <g id="hair">
    <!-- Base Hair Shape -->
    <path d="M214 235 C208 175 225 118 300 115 C375 118 392 175 386 235 C380 170 365 140 300 142 C235 140 220 170 214 235 Z" fill="url(#hairGrad)"/>
    
    <!-- Forehead Hairline (Natural masculine widow's peak / slight recession) -->
    <path d="M228 190 Q255 160 300 172 Q345 160 372 190 Q358 145 300 140 Q242 145 228 190 Z" fill="#120c08"/>

    <!-- Sideburns connecting to beard -->
    <path d="M215 220 L220 270 L225 270 L222 220 Z" fill="#17100b"/>
    <path d="M385 220 L380 270 L375 270 L378 220 Z" fill="#17100b"/>
  </g>

  <!-- Subtle Lighting Rim -->
  <path d="M214 210 C210 160 235 120 300 118" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.35"/>
</svg>
